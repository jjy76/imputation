<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLA.KR</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --accent: #7f5af0;
    --accent-2: #2cb67d;
    --text: #f4f4f5;
    --text-dim: rgba(244, 244, 245, 0.65);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
    color: var(--text);
    background: linear-gradient(120deg, var(--bg-1), var(--bg-2), var(--bg-3));
    background-size: 300% 300%;
    animation: gradientShift 18s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating orbs for depth */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.45;
    pointer-events: none;
  }

  .orb-1 {
    width: 380px;
    height: 380px;
    background: var(--accent);
    top: -80px;
    left: -80px;
    animation: float1 14s ease-in-out infinite;
  }

  .orb-2 {
    width: 320px;
    height: 320px;
    background: var(--accent-2);
    bottom: -100px;
    right: -60px;
    animation: float2 16s ease-in-out infinite;
  }

  .orb-3 {
    width: 220px;
    height: 220px;
    background: #ff6ec7;
    bottom: 10%;
    left: 8%;
    animation: float3 12s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(60px, 40px); }
  }

  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-50px, -30px); }
  }

  @keyframes float3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -20px) scale(1.08); }
  }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 64px 56px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
    animation: fadeIn 1.2s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  h1 {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #ffffff, var(--accent-2) 50%, var(--accent));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    margin-top: 18px;
    font-size: 1.05rem;
    color: var(--text-dim);
    font-weight: 300;
    letter-spacing: 0.04em;
  }

  .subtitle strong {
    color: var(--text);
    font-weight: 600;
  }

  .divider {
    width: 48px;
    height: 3px;
    margin: 28px auto;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main class="card">
    <p class="eyebrow">Welcome</p>
    <h1>HLA.KR</h1>
    <div class="divider"></div>
    <p class="subtitle">presented by <strong>JY</strong></p>
  </main>
</body>
</html>
