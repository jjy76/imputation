<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frequency · HLA.KR</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="page-wide">
  <nav class="tabs">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="frequency.html" class="active">Frequency</a>
    <a href="imputation.html">Imputation</a>
    <a href="cpra-calculator.html">cPRA Calculator</a>
  </nav>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <header class="page-header">
    <p class="eyebrow">Frequency</p>
    <h1>HLA Frequency Data</h1>
    <div class="divider"></div>
    <p class="subtitle">Antigen, allele, and common haplotype frequencies in the Korean population.</p>
  </header>

  <main class="panels">
    <section class="panel">
      <h2>Antigen Frequency</h2>
      <div class="freq-controls">
        <div>
          <label class="freq-label" for="antigen-locus">Locus</label>
          <select id="antigen-locus" class="freq-select" data-freq-locus="antigen"></select>
        </div>
        <div>
          <label class="freq-label" for="antigen-search">Search antigen</label>
          <input id="antigen-search" class="freq-search" type="search" placeholder="e.g. A2" data-freq-search="antigen">
        </div>
      </div>
      <div class="freq-table-wrap">
        <table class="freq-table" data-freq-table="antigen">
          <thead>
            <tr><th>Antigen</th><th>Frequency</th></tr>
          </thead>
          <tbody>
            <tr><td colspan="2" class="freq-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Allele Frequency</h2>
      <div class="freq-controls">
        <div>
          <label class="freq-label" for="allele-locus">Locus</label>
          <select id="allele-locus" class="freq-select" data-freq-locus="allele"></select>
        </div>
        <div>
          <label class="freq-label" for="allele-search">Search allele</label>
          <input id="allele-search" class="freq-search" type="search" placeholder="e.g. 24:02" data-freq-search="allele">
        </div>
      </div>
      <div class="freq-table-wrap">
        <table class="freq-table" data-freq-table="allele">
          <thead>
            <tr><th>Allele</th><th>Frequency</th></tr>
          </thead>
          <tbody>
            <tr><td colspan="2" class="freq-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Common Haplotype Frequency</h2>
      <div class="freq-controls">
        <div>
          <label class="freq-label" for="haplotype-type">Haplotype</label>
          <select id="haplotype-type" class="freq-select" data-freq-locus="haplotype"></select>
        </div>
      </div>
      <div class="freq-controls" data-freq-search-fields="haplotype"></div>
      <div class="freq-table-wrap">
        <table class="freq-table" data-freq-table="haplotype">
          <thead></thead>
          <tbody>
            <tr><td class="freq-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="frequency.js"></script>
</body>
</html>
